<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>void · 404</title>
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --line: rgba(154, 154, 162, .26); --bone: #d4d4d8; --ash: #7c7c85; --blood2: #c23a41; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--bone); font-family: "JetBrains Mono", ui-monospace, monospace; }
  body { display: grid; place-items: center; text-align: center; padding: 0 16px; }
  main { position: relative; width: min(360px, 100%); padding: 30px 24px 22px; border: 1px solid var(--line); }
  main::after { content: ""; position: absolute; left: -1px; top: -1px; width: 56px; height: 2px; background: var(--blood2); }
  i { position: absolute; width: 12px; height: 12px; border: solid var(--bone); }
  .tl { left: -1px; top: -1px; border-width: 1px 0 0 1px; } .tr { right: -1px; top: -1px; border-width: 1px 1px 0 0; }
  .bl { left: -1px; bottom: -1px; border-width: 0 0 1px 1px; } .br { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }
  img { width: min(170px, 46vw); height: auto; display: block; margin: 0 auto 20px; opacity: .9; }
  h1 { margin: 0; font-family: "New Rocker", serif; font-weight: 400; font-size: 56px; letter-spacing: .1em; padding-left: .1em; line-height: 1; color: #f4f4f6; }
  .m { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; font-size: 9px; letter-spacing: .5em; color: var(--ash); }
  .m::before, .m::after { content: ""; width: 36px; height: 1px; background: var(--line); }
  p { margin: 20px 0 0; font-family: "Instrument Serif", serif; font-style: italic; font-size: 26px; }
  p em { color: var(--blood2); }
  a { display: block; margin: 22px -24px -22px; padding: 14px; border-top: 1px solid var(--line); font-size: 10px; letter-spacing: .4em; text-transform: uppercase; color: #9a9aa2; text-decoration: none; transition: background .15s, color .15s; }
  a:hover { background: #9b1a22; color: #f4f4f6; }
</style>
</head>
<body>
<main>
<i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
<img src="/sigil.webp" alt="" width="480" height="468">
<h1>CDIV</h1>
<div class="m">NIHIL HIC</div>
<p>nothing here but <em>the void.</em></p>
<a href="/">‹ return</a>
</main>
</body>
</html>
