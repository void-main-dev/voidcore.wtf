<style>
  /* Void — ordo ab chao. Pure black, silver and bone; blood only where something is alive. */
  :root {
    --ink: #000; --ink2: #070708; --stone: #3a3a40; --ash: #7c7c85; --line: rgba(154, 154, 162, .26); --silver: #9a9aa2;
    --bone: #d4d4d8; --white: #f4f4f6; --blood: #9b1a22; --blood2: #c23a41;
    --serif: "Instrument Serif", Georgia, serif; --caps: "New Rocker", serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; color: var(--bone); font-family: var(--mono); }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  canvas#trail { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 3; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--silver); outline-offset: 4px; }
  [hidden] { display: none !important; }
  ::selection { background: #4a1016; color: var(--white); }


  /* ---- entry: the sigil, and one word ---- */
  #enter {
    position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; width: 100%;
    background: radial-gradient(ellipse at center, #0d0609 0%, #000 62%);
    transition: opacity 1s ease, visibility 1s;
  }
  #enter.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .gate { display: grid; justify-items: center; gap: 22px; padding: 0 16px; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .gate .word { font-family: var(--caps); font-size: 40px; letter-spacing: .5em; padding-left: .5em; color: var(--bone); opacity: 0; animation: rise 1.6s ease .9s forwards; }
  .motto { display: flex; align-items: center; gap: 12px; font-family: var(--caps); font-size: 10px; letter-spacing: .42em; color: var(--ash); white-space: nowrap; }
  .motto::before, .motto::after { content: ""; width: 44px; height: 1px; background: var(--stone); }
  .gate .motto { color: #a49d92; opacity: 0; animation: rise 1.6s ease 1.2s forwards; }
  .gate .label { margin-top: 18px; font-size: 11px; letter-spacing: .5em; padding-left: .5em; color: var(--silver); text-transform: uppercase; opacity: 0; animation: rise 1.4s ease 1.6s forwards; }
  .gate .label b { font-weight: 400; color: var(--white); }
  .gate .label i { font-style: normal; color: var(--blood2); }
  #enter.loading .label span { animation: blink 1.4s ease-in-out infinite; }
  .gate .sub { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ash); min-height: 1.2em; letter-spacing: .04em; }
  @keyframes blink { 50% { opacity: .35; } }

  /* ---- corner controls ---- */
  .ctl {
    position: fixed; z-index: 6; font-size: 10px; letter-spacing: .35em; text-transform: uppercase; color: var(--silver);
    padding: 10px 12px; transition: color .2s;
  }
  .ctl:hover { color: var(--white); }
  #skip, #replay { right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); }
  #sound { right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; }
  #sound .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
  #sound .bars i { width: 2px; background: currentColor; height: 3px; }
  #sound.on .bars i { animation: eq 1s ease-in-out infinite; background: var(--blood2); }
  #sound.on .bars i:nth-child(2) { animation-delay: -.3s; }
  #sound.on .bars i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eq { 50% { height: 10px; } }

  /* ---- the card: an engraved plate ---- */
  #card {
    position: fixed; z-index: 4; left: 50%; top: 50%;
    width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
    transform: translate(-50%, -50%) perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--ty, 14px));
    padding: 26px 28px 22px;
    background: rgba(3, 3, 4, .80); border: 1px solid rgba(58, 58, 64, .9);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 40px 90px rgba(0, 0, 0, .7), 0 0 120px rgba(155, 26, 34, .10);
    text-align: center; opacity: 0; visibility: hidden;
    transition: opacity 1.4s ease, visibility 1.4s, --ty 1.4s;
    scrollbar-width: none;
  }
  #card::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(58, 58, 64, .45); pointer-events: none; }
  #card .tick { position: absolute; width: 9px; height: 9px; border-color: var(--silver); border-style: solid; opacity: .7; }
  #card .tl { left: -1px; top: -1px; border-width: 1px 0 0 1px; } #card .tr { right: -1px; top: -1px; border-width: 1px 1px 0 0; }
  #card .bl { left: -1px; bottom: -1px; border-width: 0 0 1px 1px; } #card .br { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }
  @property --ty { syntax: "<length>"; inherits: false; initial-value: 14px; }
  #card.show { opacity: 1; visibility: visible; --ty: 0px; }
  #card.instant { transition: none; }
  .name { margin: 0; font-family: var(--caps); font-size: 42px; font-weight: 400; letter-spacing: .42em; padding-left: .42em; line-height: 1.1; color: var(--bone); }
  #card .motto { justify-content: center; margin: 10px 0 0; }
  .handle { margin: 14px 0 0; font-size: 11px; color: var(--ash); letter-spacing: .1em; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .handle button:hover { color: var(--white); }
  .status { width: 7px; height: 7px; border-radius: 50%; background: var(--stone); display: none; flex: none; }
  .status.online { background: var(--blood2); box-shadow: 0 0 8px var(--blood2); } .status.idle { background: var(--ash); } .status.dnd { background: var(--blood); }
  .bio { margin: 14px 0 0; min-height: 1.5em; font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--bone); line-height: 1.35; letter-spacing: .02em; }
  .bio .cur { display: inline-block; width: 1px; height: 1em; vertical-align: -.12em; margin-left: 3px; background: var(--blood2); animation: blink 1s steps(1) infinite; }
  .presence {
    display: none; align-items: center; gap: 12px; margin: 18px 0 0; padding: 10px 12px; text-align: left;
    border-top: 1px solid rgba(58, 58, 64, .7); border-bottom: 1px solid rgba(58, 58, 64, .7); font-size: 11px;
  }
  .presence.show { display: flex; }
  .presence img { width: 40px; height: 40px; flex: none; object-fit: cover; filter: grayscale(1) contrast(1.1); }
  .presence .t { min-width: 0; }
  .presence .k { color: var(--ash); letter-spacing: .25em; text-transform: uppercase; font-size: 9px; }
  .presence .v, .presence .w { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .presence .v { color: var(--bone); margin-top: 4px; font-family: var(--serif); font-size: 15px; }
  .presence .w { color: var(--ash); margin-top: 1px; }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; margin: 20px 0 0; }
  .links a, .links button { width: 38px; height: 40px; display: grid; place-items: center; position: relative; }
  .links a::after, .links button::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 4px; height: 2px; background: var(--blood2); transform: scaleX(0); transition: transform .25s ease; }
  .links a:hover::after, .links button:hover::after { transform: scaleX(1); }
  .links img { width: 17px; height: 17px; filter: invert(.62); transition: filter .2s; }
  .links a:hover img, .links button:hover img { filter: invert(.95); }
  .projects { display: none; margin: 20px 0 0; text-align: left; border-top: 1px solid rgba(58, 58, 64, .7); padding-top: 12px; }
  .projects.show { display: grid; gap: 2px; }
  .projects a { display: block; color: inherit; text-decoration: none; padding: 9px 4px; border-left: 2px solid transparent; transition: border-color .2s, padding .2s; }
  .projects a:hover { border-color: var(--blood2); padding-left: 10px; }
  .projects .pt { font-family: var(--caps); font-size: 12px; letter-spacing: .2em; } .projects .pd { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ash); margin-top: 2px; }
  .foot { margin: 18px 0 0; font-size: 9px; letter-spacing: .45em; padding-left: .45em; color: rgba(142, 135, 124, .7); text-transform: uppercase; }

  #toast {
    position: fixed; z-index: 7; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translate(-50%, 10px);
    font-size: 10px; letter-spacing: .3em; text-transform: uppercase; padding: 9px 14px;
    background: rgba(0, 0, 0, .9); border: 1px solid var(--stone); border-bottom: 2px solid var(--blood); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* no WebGL2: a quiet starfield behind the card */
  body.nogl { background:
    radial-gradient(circle at 50% 50%, rgba(255, 45, 85, .16), transparent 36%),
    radial-gradient(1px 1px at 12% 22%, #fff, transparent), radial-gradient(1px 1px at 78% 14%, #fde, transparent),
    radial-gradient(1px 1px at 33% 72%, #fff, transparent), radial-gradient(1px 1px at 88% 66%, #dde, transparent),
    radial-gradient(1px 1px at 57% 31%, #fff, transparent), radial-gradient(1px 1px at 22% 88%, #fde, transparent),
    radial-gradient(1px 1px at 67% 84%, #fff, transparent), radial-gradient(1px 1px at 5% 50%, #fff, transparent),
    radial-gradient(1px 1px at 95% 40%, #fde, transparent), radial-gradient(1px 1px at 45% 8%, #fff, transparent), #000; }
  body.nogl canvas#c { display: none; }


  /* the seal: the sigil inside a slowly turning engraved dial; its eye is the one living red thing */
  .seal { position: relative; width: 224px; height: 224px; margin: -4px auto 4px; display: grid; place-items: center; }
  .seal .dial { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .seal .spin { transform-origin: 100px 100px; animation: spin 140s linear infinite; }
  .seal .hair { fill: none; stroke: rgba(154, 154, 162, .32); stroke-width: .5; }
  .seal .ticks { fill: none; stroke: rgba(154, 154, 162, .5); stroke-width: .6; }
  .seal .dia path { fill: var(--silver); opacity: .75; }
  .seal .dash { fill: none; stroke: rgba(155, 26, 34, .45); stroke-width: .5; stroke-dasharray: 1 5; transform-origin: 100px 100px; animation: spin 90s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .seal .emblem { position: relative; width: 66%; height: auto; margin: 0; display: block; filter: drop-shadow(0 0 22px rgba(155, 26, 34, .22)) drop-shadow(0 2px 6px #000); }
  .seal .eye { position: absolute; left: 50%; top: 46%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(226, 60, 70, .75) 0%, rgba(155, 26, 34, .35) 35%, transparent 70%); mix-blend-mode: screen; animation: pulse 4.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  .gate .seal { width: min(330px, 76vw); height: min(330px, 76vw); margin: 0; opacity: 0; animation: rise 2.2s ease .1s forwards; }

  /* silver lettering with a slow pass of light */
  .sheen { background: linear-gradient(105deg, #77777f 0%, #c9c9cf 30%, #ffffff 42%, #c9c9cf 54%, #6c6c74 100%); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(255, 255, 255, .08)); animation: sheen 8s ease-in-out infinite; }
  @keyframes sheen { 0%, 55% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .gate .word.sheen { animation: rise 1.6s ease .9s forwards, sheen 8s ease-in-out 2.5s infinite; }

  .orn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 18px 0 0; }
  .orn::before, .orn::after { content: ""; width: 70px; height: 1px; background: linear-gradient(90deg, transparent, var(--stone)); }
  .orn::after { transform: scaleX(-1); }
  .orn i { width: 5px; height: 5px; transform: rotate(45deg); border: 1px solid var(--silver); opacity: .8; }
  .links { margin-top: 12px !important; }

  /* corners: a small diamond where the frame lines meet */
  #card .tick::after { content: ""; position: absolute; width: 4px; height: 4px; background: var(--silver); transform: rotate(45deg); }
  #card .tl::after { left: -3px; top: -3px; } #card .tr::after { right: -3px; top: -3px; } #card .bl::after { left: -3px; bottom: -3px; } #card .br::after { right: -3px; bottom: -3px; }
  #card .tick { width: 16px; height: 16px; }

  /* the card writes itself in, top to bottom */
  #card .rv { opacity: 0; transform: translateY(6px); transition: opacity .9s ease, transform .9s ease; transition-delay: calc(.25s + var(--d) * .12s); }
  #card.show .rv { opacity: 1; transform: none; }
  #card.instant .rv { transition: none; }
  .bio { font-size: 19px; }

  @media (max-width: 520px) { #card { padding: 22px 18px 18px; } .name { font-size: 30px; } .seal { width: 196px; height: 196px; } }
  @media (prefers-reduced-motion: reduce) {
    #sound.on .bars i, .bio .cur { animation: none; }
    .sheen { background-position: 50% 0; }
    .gate .seal, .seal .spin, .seal .dash, .seal .eye, .sheen, .gate .word, .gate .motto, .gate .label { animation: none; opacity: 1; }
  }

  /* ---- v5: a hard plate cut from the same grid as the eye ---- */
  #card {
    width: min(400px, calc(100vw - 32px)); padding: 24px 26px 16px;
    background: rgba(0, 0, 0, .8); border: 1px solid var(--line);
    -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: 0 30px 80px #000;
  }
  #card::before { inset: 4px; border-color: rgba(154, 154, 162, .1); }
  #card::after { content: ""; position: absolute; left: -1px; top: -1px; width: 56px; height: 2px; background: var(--blood2); }
  #card .tick { width: 12px; height: 12px; border-color: var(--bone); opacity: .9; }
  #card .tick::after { display: none; }

  .seal { width: 188px; height: 188px; margin: 2px auto 6px;
    background:
      linear-gradient(var(--bone), var(--bone)) 0 0 / 10px 1px, linear-gradient(var(--bone), var(--bone)) 0 0 / 1px 10px,
      linear-gradient(var(--bone), var(--bone)) 100% 0 / 10px 1px, linear-gradient(var(--bone), var(--bone)) 100% 0 / 1px 10px,
      linear-gradient(var(--bone), var(--bone)) 0 100% / 10px 1px, linear-gradient(var(--bone), var(--bone)) 0 100% / 1px 10px,
      linear-gradient(var(--bone), var(--bone)) 100% 100% / 10px 1px, linear-gradient(var(--bone), var(--bone)) 100% 100% / 1px 10px;
    background-repeat: no-repeat; }
  .seal .cross { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(var(--line), var(--line)) 50% 0 / 1px 14px, linear-gradient(var(--line), var(--line)) 50% 100% / 1px 14px,
      linear-gradient(var(--line), var(--line)) 0 50% / 14px 1px, linear-gradient(var(--line), var(--line)) 100% 50% / 14px 1px;
    background-repeat: no-repeat; }
  .seal .emblem { width: 80%; filter: drop-shadow(0 2px 6px #000); }
  .gate .seal { width: min(300px, 70vw); height: min(300px, 70vw); }

  .name, .gate .word { font-family: var(--caps); font-weight: 700; color: var(--white); text-transform: none; }
  .name { font-size: 58px; font-weight: 400; letter-spacing: .1em; padding-left: .1em; line-height: 1; margin-top: 6px; }
  .gate .word { font-weight: 400; font-size: 64px; letter-spacing: .14em; padding-left: .14em; }
  .motto { font-family: var(--mono); font-size: 9px; letter-spacing: .5em; color: var(--ash); gap: 14px; }
  .motto::before, .motto::after { width: 36px; background: var(--line); }
  #card .motto { margin-top: 12px; }
  .gate .motto { color: var(--silver); }
  .gate .sub { font-size: 16px; color: var(--silver); }

  .bio { margin-top: 20px; font-size: 28px; line-height: 1.25; letter-spacing: 0; color: var(--bone); }
  .bio em { font-style: italic; color: var(--blood2); }
  .bio .cur { width: 2px; background: var(--blood2); }

  .rule { position: relative; height: 1px; margin: 20px -26px 0; background: var(--line); }
  .rule i { position: absolute; left: 50%; top: -2px; width: 5px; height: 5px; margin-left: -2px; background: var(--blood2); }
  .handle { margin-top: 14px; font-size: 10px; letter-spacing: .18em; color: var(--silver); }
  .status { width: 6px; height: 6px; border-radius: 0; }
  .status.online { box-shadow: none; }

  .links { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; margin: 14px 0 0 !important; border: 1px solid var(--line); }
  .links a, .links button { width: auto; height: 42px; border-right: 1px solid var(--line); transition: background .15s; }
  .links > :last-child { border-right: 0; }
  .links a::after, .links button::after { display: none; }
  .links a:hover, .links button:hover { background: var(--blood); }
  .links img { width: 16px; height: 16px; filter: invert(.8); }
  .links a:hover img, .links button:hover img { filter: invert(1); }

  .foot { display: flex; justify-content: space-between; margin: 14px 0 0; padding: 0; font-size: 8px; letter-spacing: .3em; color: var(--ash); }
  .presence .v, .projects .pd { font-size: 16px; }
  @media (max-width: 520px) { .name { font-size: 44px; } .bio { font-size: 22px; } .seal { width: 164px; height: 164px; } .rule { margin-inline: -18px; } }
</style>

</head>
<body>
<canvas id="c"></canvas>
<canvas id="trail"></canvas>

<button id="enter" class="loading" aria-label="enter">
  <span class="gate">
    <div class="seal"><img class="emblem" src="sigil.webp" alt="" width="480" height="468"><i class="cross"></i></div>
    <span class="word">VOID</span>
    <span class="motto">VENI · VIDI · VICI</span>
    <span class="label" id="enterLabel"><span>loading</span></span>
    <span class="sub" id="enterSub"></span>
  </span>
</button>

<button id="skip" class="ctl" hidden>skip ›</button>
<button id="replay" class="ctl" hidden aria-label="replay">↻ again</button>
<button id="sound" class="ctl" hidden aria-label="sound"><span class="bars"><i></i><i></i><i></i></span><span id="soundLabel">sound</span></button>

<main id="card" aria-live="polite">
  <i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i>
  <div class="seal rv" style="--d:0"><img class="emblem" id="emblem" src="sigil.webp" alt="" width="480" height="468"><i class="cross"></i></div>
  <h1 class="name rv" style="--d:1" id="name"></h1>
  <div class="motto rv" style="--d:2" id="motto"></div>
  <p class="bio rv" style="--d:4"><span id="bio"></span><span class="cur"></span></p>
  <div class="presence" id="presence"><img id="presImg" alt=""><div class="t"><div class="k" id="presK"></div><div class="v" id="presV"></div><div class="w" id="presW"></div></div></div>
  <div class="rule rv" style="--d:5"><i></i></div>
  <p class="handle rv" style="--d:5"><span class="status" id="status"></span><span id="handle"></span></p>
  <nav class="links rv" style="--d:6" id="links"></nav>
  <div class="projects" id="projects"></div>
  <p class="foot rv" style="--d:7"><span>N° 001</span><span>voidcore.wtf</span><span>MMXXVI</span></p>
</main>
<div id="toast"></div>
<audio id="music" loop preload="none"></audio>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uEye, uIris, uAtlas, uHeartT;
uniform vec2 uRes, uCell, uEyeSize;
uniform vec4 uIrisBox;          // x0, y0, size (photo px), texture size
uniform vec2 uCam;              // camera centre, photo px
uniform float uScale;           // photo px per device px
uniform float uN, uNT;          // ramp glyphs, total glyphs (ramp + star glyphs)
uniform float uReveal, uStars, uStarsAll, uEyeAmt, uHeart, uHeartUnit, uGlow, uTime;
uniform vec2 uHeartC;            // heart centre, photo px (pupil centre, follows uLook)
uniform vec4 uCard;              // the card on screen, px (x0, y0, x1, y1); zero before it appears
uniform float uCardRun;          // 0..1: blood leaving the card
uniform float uDrip;             // blood running from the heart, 0..1
uniform float uBeat;             // the heart's last beat, 0..1, already faded
uniform float uHW, uHM, uLove;          // engraving width in heart units; density from ink (1) or light (0)
uniform vec3 uTear;              // how far each black tear has run, 0..1
uniform vec2 uLook;              // iris offset towards the cursor, photo px
uniform float uGamma, uDebug, uLo, uIB, uCB, uK, uLC, uDi;
out vec4 o;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

vec3 tone(vec3 c) {               // same as Ascii.to_image: lift darks, boost saturation
  c = pow(clamp(c, 0.0, 1.0), vec3(uGamma));
  float l = dot(c, vec3(0.30, 0.55, 0.15));
  return clamp(mix(vec3(l), c, 1.6), 0.0, 1.0);
}

vec3 blood(float t) {             // black -> clotted -> #9b1a22 -> #c23a41 -> a pale wet highlight
  t = clamp(t, 0.0, 1.0);
  vec3 c = mix(vec3(0.05, 0.0, 0.01), vec3(0.34, 0.03, 0.06), smoothstep(0.0, 0.35, t));
  c = mix(c, vec3(0.61, 0.10, 0.13), smoothstep(0.30, 0.60, t));
  c = mix(c, vec3(0.80, 0.24, 0.26), smoothstep(0.55, 0.85, t));
  return mix(c, vec3(1.0, 0.78, 0.74), smoothstep(0.88, 1.0, t));
}

float vnoise(vec2 p) {
  vec2 i = floor(p), u = fract(p); u = u * u * (3.0 - 2.0 * u);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}

float loveAt(float k) {           // "i love you " -> atlas slot past the stars, -1 for the gaps
  k = mod(k, 11.0);
  return k < 0.5 ? 0.0 : k < 1.5 ? -1.0 : k < 2.5 ? 1.0 : k < 3.5 ? 2.0 : k < 4.5 ? 3.0 : k < 5.5 ? 4.0 : k < 6.5 ? -1.0 : k < 7.5 ? 5.0 : k < 8.5 ? 2.0 : k < 9.5 ? 6.0 : -1.0;
}

float glyph(float idx, vec2 f) {
  return texture(uAtlas, vec2((idx + f.x) / uNT, f.y)).a;
}

void main() {
  vec2 pix = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 cell = floor(pix / uCell);
  vec2 f = fract(pix / uCell);
  vec2 sc = (cell + 0.5) * uCell;
  vec2 p = uCam + (sc - 0.5 * uRes) * uScale;
  // the iris slides towards the cursor; the lids and brow stay put
  vec2 pc = uHeartC - uLook;
  vec2 pe = p - uLook * smoothstep(2.1 * 142.0, 1.25 * 142.0, length(p - pc));
  float h0 = hash(cell), h1 = hash(cell + 17.3), h2 = hash(cell * 1.37 + 3.1);

  // ---- eye ----
  float cellPhoto = uCell.x * uScale;
  float lodE = log2(max(cellPhoto, 1e-4));
  float lodI = log2(max(cellPhoto * uIrisBox.w / uIrisBox.z, 1e-4));
  vec2 uv = pe / uEyeSize;
  float inEye = smoothstep(0.0, 0.02, uv.x) * smoothstep(1.0, 0.98, uv.x) * smoothstep(0.0, 0.02, uv.y) * smoothstep(1.0, 0.98, uv.y);
  vec4 e0 = textureLod(uEye, uv, lodE);
  float scl = e0.b * inEye;                                     // sclera mask rides in the blue channel
  vec3 raw = e0.rrr * inEye;
  vec3 rawB = textureLod(uEye, uv, lodE + 2.6).rrr * inEye;
  vec2 q = (pe - uIrisBox.xy) / uIrisBox.z;
  float wI = smoothstep(0.0, 0.1, q.x) * smoothstep(1.0, 0.9, q.x) * smoothstep(0.0, 0.1, q.y) * smoothstep(1.0, 0.9, q.y);
  vec4 i0 = textureLod(uIris, q, max(lodI, 0.0));
  float wII = wI * clamp(2.0 * i0.a - 1.0, 0.0, 1.0);             // the hi-res iris only inside the iris; the inked eye elsewhere
  raw = mix(raw, i0.rgb, wII);
  rawB = mix(rawB, textureLod(uIris, q, max(lodI + 2.6, 0.0)).rgb, wII);
  // iris mask baked into alpha as 0.5..1 (lid already cut out), pupil excluded
  float dI = length(pe - pc) / 142.0;
  float irisM = clamp(2.0 * mix(e0.a, i0.a, wI) - 1.0, 0.0, 1.0) * inEye * smoothstep(0.30, 0.36, dI);
  vec3 c = tone(raw);
  vec3 cb = tone(rawB);
  float L = dot(c, vec3(0.30, 0.55, 0.15));
  float Lb = dot(cb, vec3(0.30, 0.55, 0.15));
  float Ln = max(pow(clamp((L + uLC * (L - Lb) - 0.08) / 0.92, 0.0, 1.0), 1.1), 0.95 * L);
  Ln = pow(clamp((Ln - uLo) / (0.92 - uLo), 0.0, 1.0), uK);        // stretch + curve: brow and lashes sparse, skin mid, sclera dense
  vec3 ci = pow(clamp(raw, 0.0, 1.0), vec3(0.45)), cib = pow(clamp(rawB, 0.0, 1.0), vec3(0.45));   // the iris keeps the old, lifted tone
  float LI = dot(ci, vec3(0.30, 0.55, 0.15)), LIb = dot(cib, vec3(0.30, 0.55, 0.15));
  float Li = 0.30 + 0.70 * smoothstep(uIB, 0.75, LI + 0.8 * (LI - LIb));   // iris: its own range, limbus sparse .. collarette dense
  Ln *= 1.0 - 0.3 * scl * (1.0 - irisM);                          // the white of the eye stays mid-dense; the iris carries the light
  vec2 dv = pe - pc; float ang = atan(dv.y, dv.x);
  float fib = 0.65 * vnoise(vec2(ang * 70.0, dI * 5.0)) + 0.35 * vnoise(vec2(ang * 190.0, dI * 13.0 + 3.0));
  float wz = smoothstep(3.5, 0.8, cellPhoto) * irisM;            // only once the iris is magnified past its photo
  Li = mix(Li, Li * smoothstep(0.30, 0.75, fib) * 1.15, wz);      // radial fibres with black between them
  Li *= 1.0 - 0.45 * uStars * irisM;
  Ln = mix(Ln, Li, irisM);
  float idx = clamp(floor(Ln * (uN - 1.0) + (h0 - 0.5) * uDi * smoothstep(0.04, 0.15, Ln)), 0.0, uN - 1.0);   // true black stays empty
  // forming: cells switch on at random, scrambling just before they settle
  float th = 0.75 * cell.y * uCell.y / uRes.y + 0.17 * h1;   // rows sweep in from the top
  float on = smoothstep(th, th + 0.06, uReveal);
  if (on < 1.0) idx = floor(hash(cell + floor(uTime * 14.0)) * (uN - 1.0));
  float mx = max(max(c.r, c.g), max(c.b, 0.04));
  vec3 hue = mix(vec3(0.86, 0.86, 0.9), vec3(1.0), smoothstep(0.5, 0.9, Ln));   // skin and sclera: silver to bone
  vec3 col = min(hue * (uCB + (1.1 - uCB) * Ln), 1.0);          // brightness follows the glyph ramp
  // bloodshot: thin red capillaries creep over the sclera from the corners towards the iris
  vec2 vp = pe / 38.0;
  float vn = vnoise(vp + 1.7 * vec2(vnoise(vp * 0.5), vnoise(vp * 0.5 + 9.2))) + 0.5 * vnoise(vp * 2.3 + 4.0);
  float vein = smoothstep(0.09, 0.0, abs(vn - 0.75)) * scl * (1.0 - irisM) * smoothstep(1.1, 2.4, dI);
  col = mix(col, vec3(0.62, 0.08, 0.10) * (0.7 + 0.6 * Ln), vein);
  col = mix(col, blood(0.22 + 0.62 * Li + 0.3 * smoothstep(0.93, 1.0, LI)), irisM);                 // the iris bleeds
  vec3 eye = col * glyph(idx, f) * on * uEyeAmt;
  eye *= 1.0 - uStars * smoothstep(0.24, 0.16, L);               // during the dive the pupil empties into black

  // ---- stars: fill the dark of the pupil ----
  float dark = smoothstep(0.30, 0.12, L) * uStars + uStarsAll;
  vec3 star = vec3(0.0);
  float tw = 0.55 + 0.45 * sin(uTime * (1.5 + 4.0 * h1) + h0 * 6.283);
  if (h2 < 0.045) {
    float sidx = uN + floor(hash(cell + 5.0) * 4.0);          // + | - •
    vec3 sc0 = mix(vec3(0.95, 0.95, 0.98), vec3(0.78, 0.8, 0.86), h1);
    star = sc0 * glyph(sidx, f) * tw * (0.5 + 0.5 * h0);
  }
  for (int k = 0; k < 4; k++) {                               // sparkle crosses around bright stars
    vec2 d = k == 0 ? vec2(1, 0) : k == 1 ? vec2(-1, 0) : k == 2 ? vec2(0, 1) : vec2(0, -1);
    vec2 nc = cell + d;
    if (hash(nc * 1.37 + 3.1) < 0.006) {
      float twn = 0.55 + 0.45 * sin(uTime * (1.5 + 4.0 * hash(nc + 17.3)) + hash(nc) * 6.283);
      float sidx = uN + (k < 2 ? 2.0 : 1.0);
      star = max(star, vec3(0.92, 0.92, 0.96) * glyph(sidx, f) * twn * 0.8);
    }
  }
  if (hash(cell * 1.37 + 3.1) < 0.006) star = vec3(1.0) * glyph(uN + 4.0, f) * tw;   // centre *
  vec3 outc = eye + star * dark;

  // ---- haze: slow smoke of dim glyphs in the dark around the eye ----
  if (uStars < 1.0 && dot(eye, vec3(1.0)) < 0.02) {
    vec2 hz = p / 240.0 + vec2(0.0, uTime * 0.035);
    float n = vnoise(hz + 1.3 * vec2(vnoise(hz * 0.7 + uTime * 0.02), vnoise(hz * 0.7 + 4.1)));
    n *= 0.6 + 0.4 * vnoise(p / 70.0 - vec2(uTime * 0.05, 0.0));
    float rim = smoothstep(150.0, 600.0, length(p - vec2(1165.0, 865.0)));   // thicker away from the eye
    float dens = smoothstep(0.30, 0.75, n) * (0.35 + 0.65 * rim) * (1.0 - uStars) * smoothstep(0.0, 1.0, uReveal);
    if (h2 < 0.30 * dens) {
      float gi = floor(hash(cell + floor(uTime * 0.6 + h0 * 7.0)) * 0.55 * (uN - 1.0));
      vec3 hzc = mix(vec3(0.42, 0.42, 0.47), vec3(0.45, 0.05, 0.08), step(0.72, h1));
      outc += hzc * (0.35 + 0.65 * dens) * glyph(gi, f);
    }
  }

  // ---- black tears: ink running from the lower lid, drawn by their wet silver edges ----
  for (int k = 0; k < 3; k++) {
    float run = k == 0 ? uTear.x : k == 1 ? uTear.y : uTear.z;
    if (run <= 0.0) continue;
    vec3 T = k == 0 ? vec3(1092.0, 972.0, 278.0) : k == 1 ? vec3(1232.0, 980.0, 352.0) : vec3(1352.0, 962.0, 212.0);   // x, y at the lid, full length (photo px)
    float len = T.z * run;
    float dy = p.y - T.y;
    float rim = max(cellPhoto * 0.9, 3.0);
    float sd = 1e5, side = 0.0;
    if (dy > -14.0 && dy < len) {
      float u = clamp(dy / T.z, 0.0, 1.0);
      float cx = T.x + 7.0 * sin(dy / 55.0 + float(k) * 2.1) + 0.03 * dy * (float(k) - 1.0);
      float hw = mix(15.0, 8.0, u) * (1.0 + 0.25 * sin(dy / 23.0 + float(k)));
      sd = abs(p.x - cx) - max(hw, rim * 0.8);
      side = sign(p.x - cx);
    }
    // the bead at the tip, heavier than the stream
    float tipY = T.y + len, tipX = T.x + 7.0 * sin(len / 55.0 + float(k) * 2.1) + 0.03 * len * (float(k) - 1.0);
    float sb = length((p - vec2(tipX, tipY + 4.0)) * vec2(1.0, 0.8)) - max(13.0, rim * 1.3);
    if (sb < sd) { sd = sb; side = sign(p.x - tipX - 4.0); }
    if (sd < -0.35 * rim) {
      float wet = 0.5 + 0.5 * vnoise(vec2(p.x / 9.0, p.y / 30.0 - uTime * 0.8));
      outc = mix(vec3(0.16, 0.02, 0.03), vec3(0.30, 0.04, 0.06), wet) * glyph(floor((0.45 + 0.4 * wet) * (uN - 1.0)), f);   // inside: dense dark ink, slowly sliding
      if (sb < -0.35 * rim && p.y < tipY - 2.0 && p.x < tipX - 2.0 && h0 < 0.5) outc = vec3(0.9) * glyph(uN + 4.0, f);   // a glint in the bead
    } else if (sd < 0.65 * rim) {
      float lit = side < 0.0 ? 1.0 : 0.45;                                  // light from the left
      vec3 edge = mix(vec3(0.42, 0.06, 0.08), vec3(0.88, 0.88, 0.92), lit);
      float eidx = floor((0.35 + 0.3 * lit) * (uN - 1.0) + (h0 - 0.5) * 4.0);
      outc = edge * glyph(clamp(eidx, 1.0, uN - 1.0), f) * (0.75 + 0.25 * h1);
    }
    // where it leaves the lid, the rim is stained red
    float st = smoothstep(26.0, 0.0, length(p - T.xy)) * smoothstep(0.0, 0.15, run);
    outc = mix(outc, vec3(0.62, 0.08, 0.1) * glyph(floor((0.3 + 0.4 * h1) * (uN - 1.0)), f), st * 0.8);
  }

  // ---- heart: an old engraving of a real heart (after Senac), faded, cracked into plates that have slipped, barely beating ----
  if (uHeart > 0.0) {
    vec2 hc0 = 0.5 * uRes + (uHeartC - uCam) / uScale;
    float sTrue = uHeartUnit / uScale;
    float s = max(sTrue, 0.55 * uCell.y);
    float dot0 = smoothstep(2.0 * uCell.y, 0.8 * uCell.y, sTrue);    // far away: a plain red dot
    float live = 1.0 - dot0;
    float A = uHeart;
    vec2 hs = vec2(1.0, 690.0 / 520.0) * uHW * s;                     // engraving size on screen, px
    // it does not grow with the beat; it shivers, and sags a little, slowly
    vec2 jit = vec2(uBeat * 0.45 * uCell.x * sin(uTime * 41.0), 0.25 * uCell.y * sin(uTime * 0.31)) * live;
    vec2 hO = hc0 + jit - vec2(0.5, 0.52) * hs;                        // top-left of the engraving
    vec2 uv = (sc - hO) / hs;
    // cracked into plates; each has slipped a little, mostly downwards
    vec2 vq = uv * vec2(3.0, 3.6) + 0.35 * vec2(vnoise(uv * 4.0), vnoise(uv * 4.0 + 5.2));
    vec2 vi = floor(vq), vf = fract(vq);
    float d1 = 9.0, d2 = 9.0; vec2 pid = vec2(0.0);
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
      vec2 g = vec2(float(i), float(j));
      vec2 pt = g + 0.15 + 0.7 * vec2(hash(vi + g), hash(vi + g + 7.7));
      float dd = length(vf - pt);
      if (dd < d1) { d2 = d1; d1 = dd; pid = vi + g; } else if (dd < d2) d2 = dd;
    }
    vec2 slip = (vec2(hash(pid + 1.3), hash(pid + 4.1)) - vec2(0.5, 0.15)) * vec2(0.014, 0.022) * live;
    vec2 uv2 = uv - slip;
    float cw = max(0.025, 0.55 * uCell.x / hs.x * 3.0);
    float crack = step(d2 - d1, cw) * step(0.38, vnoise(uv * 3.3 + 9.0)) * live;
    float texPx = 520.0 * uCell.x / hs.x;                               // engraving px under one cell
    float lodH = log2(max(texPx, 1e-4));
    float inB = step(0.0, uv2.x) * step(uv2.x, 1.0) * step(0.0, uv2.y) * step(uv2.y, 1.0);
    vec4 ht = textureLod(uHeartT, uv2, lodH) * inB;
    float m = smoothstep(0.35, 0.65, ht.a);
    float depth = ht.b;                                                 // 0 at the outline, 1 deep inside
    // worn: whole patches have gone grey and thin; the rim and the underside are coming away
    float fade = smoothstep(0.22, 0.78, 0.65 * vnoise(uv * 3.0 + 7.0) + 0.35 * vnoise(uv * 9.0 + 2.0));
    float erode = (1.0 - smoothstep(0.0, 0.3, depth)) * (0.35 + 0.65 * vnoise(uv * 13.0)) * (0.5 + 0.7 * uv.y) * live;
    float gone = step(h2, 0.75 * erode);
    float rb = textureLod(uHeartT, uv2, lodH + 2.5).r;
    float lightL = pow(clamp((ht.r - 0.32) / 0.55 + 2.0 * (ht.r - rb), 0.0, 1.0), 1.25);   // shading, with the local contrast pulled up like the eye
    float inkL = clamp(ht.g * 1.5, 0.0, 1.0);
    // volume: light from the upper left over the rounded mass, from the depth channel
    float eB = 6.0 / 520.0;
    vec2 gB = vec2(textureLod(uHeartT, uv2 + vec2(eB, 0.0), lodH + 1.5).b - textureLod(uHeartT, uv2 - vec2(eB, 0.0), lodH + 1.5).b,
                   textureLod(uHeartT, uv2 + vec2(0.0, eB), lodH + 1.5).b - textureLod(uHeartT, uv2 - vec2(0.0, eB), lodH + 1.5).b);
    float form = clamp(0.55 + 4.0 * dot(gB, vec2(0.6, 0.8)) * -1.0, 0.0, 1.0);
    float Lh = uHM > 1.5 ? max(0.55 * lightL, inkL) : uHM > 0.5 ? inkL : lightL;
    Lh = clamp(0.62 * Lh + 0.48 * form * smoothstep(0.0, 0.5, depth + 0.3) - 0.05, 0.0, 1.0);
    Lh *= mix(0.6, 1.0, fade);
    Lh *= 1.0 - 0.4 * smoothstep(0.3, 0.85, inkL) * live;            // the engraved lines and vessels cut back through as dark
    float wash = uBeat * smoothstep(0.08, 0.6, depth) * live;           // each beat surfaces from inside, then sinks
    // the engraving itself has gone to ash; dried blood is left in patches and along the cracks
    float nearCrack = step(d2 - d1, 3.0 * cw) * step(0.38, vnoise(uv * 3.3 + 9.0));
    float stain = clamp(smoothstep(0.42, 0.68, vnoise(uv * 2.4 + 3.0)) + 0.8 * nearCrack + 0.6 * (1.0 - smoothstep(0.0, 0.25, depth)) + 0.55 * smoothstep(0.45, 0.1, uv.y), 0.0, 1.0);   // the great vessels on top keep the most blood
    stain = max(stain, wash);
    vec3 ashC = mix(vec3(0.52, 0.48, 0.49), vec3(0.84, 0.78, 0.76), Lh) * mix(0.7, 1.0, fade);   // ash, never paper white
    vec3 dried = blood(0.36 + 0.42 * Lh + 0.3 * wash);
    vec3 hcol = mix(ashC, dried, stain * live);
    float hidx = clamp(floor((0.06 + 0.90 * Lh + 0.10 * wash) * (uN - 1.0) + (h2 - 0.5) * 3.0), 0.0, uN - 1.0);
    float gl0 = glyph(hidx, f);
    if (uLove > 0.5 && live > 0.0) {
      // written instead of drawn: rings of "i love you" turning around the centre, alternate rings the other way
      vec2 rv = (sc - hc0) / uCell;
      float rr = length(rv * vec2(uCell.x / uCell.y, 1.0));
      float ring = floor(rr + 0.5);
      float n = max(floor(6.2832 * ring * uCell.y / uCell.x), 1.0);
      float dir = mod(ring, 2.0) < 0.5 ? 1.0 : -1.0;
      float pos = (atan(rv.y * uCell.y, rv.x * uCell.x) / 6.2832 + 0.5) * n + dir * uTime * (0.35 + 0.25 * hash(vec2(ring, 4.0))) + 11.0 * hash(vec2(ring, 9.0));
      float li = loveAt(floor(pos));
      float on = step(0.05, Lh) * step(-0.5, li);
      gl0 = li < -0.5 ? 0.0 : glyph(uN + 5.0 + li, f) * on;
      hcol *= 0.75 + 0.75 * Lh;                                         // brightness now rides on colour, not glyph weight
    }
    hcol *= gl0 * (1.0 - crack) * (1.0 - gone);
    hcol = mix(hcol, vec3(0.80, 0.16, 0.18) * glyph(uN - 1.0, f), dot0);
    float halo = textureLod(uHeartT, uv, lodH + 3.0).a * step(0.0, uv.y) * step(uv.y, 1.0) * step(0.0, uv.x) * step(uv.x, 1.0);
    outc *= 1.0 - 0.85 * A * live * smoothstep(0.03, 0.35, halo) * (1.0 - m);   // a black moat keeps the stars off it
    outc = mix(outc, hcol, A * m);
    // around it: a slow mist of dim blood, thicker near the heart
    if (live > 0.0 && m < 0.5) {
      float near = textureLod(uHeartT, uv, lodH + 5.5).a * step(-0.3, uv.y) * step(uv.y, 1.3) * step(-0.3, uv.x) * step(uv.x, 1.3);
      vec2 mz = sc / (9.0 * uCell.y) + vec2(0.0, uTime * 0.04);
      float mn = vnoise(mz + 1.3 * vec2(vnoise(mz * 0.7 + uTime * 0.03), vnoise(mz * 0.7 + 4.1)));
      float dens = smoothstep(0.3, 0.75, mn) * smoothstep(0.01, 0.3, near) * smoothstep(0.85, 0.35, near) * live;   // a band around it, the moat stays clear
      if (h2 < 0.26 * dens) {
        float gi = floor(hash(cell + floor(uTime * 0.5 + h0 * 7.0)) * 0.45 * (uN - 1.0));
        outc = mix(vec3(0.30, 0.04, 0.06), vec3(0.34, 0.31, 0.32), step(0.8, h1)) * (0.4 + 0.6 * dens) * glyph(gi, f) * A;
      }
    }
    // ash: glyphs come off the lower rim and drift down, thinning out
    if (live > 0.0 && m < 0.5) {
      float row = cell.y - floor(uTime * (1.4 + 1.2 * hash(vec2(cell.x, 2.0))) + 60.0 * hash(vec2(cell.x, 1.0)));
      float src = textureLod(uHeartT, uv - vec2(0.0, 0.10), lodH + 4.0).a * smoothstep(0.45, 0.75, uv.y) * step(0.0, uv.x) * step(uv.x, 1.0);
      if (hash(vec2(cell.x, row)) < 0.10 * src) {
        float gi = floor(hash(vec2(row, cell.x)) * 0.3 * (uN - 1.0)) + 1.0;
        outc = mix(vec3(0.32, 0.28, 0.28), vec3(0.42, 0.08, 0.10), step(0.6, h1)) * (0.4 + 0.6 * src) * glyph(gi, f) * A;
      }
    }
    // it seeps from the apex: one thin line, and now and then a single drop lets go
    for (int k = 0; k < 2; k++) {
      if (uDrip <= 0.0 || live <= 0.0) break;
      vec3 T = k == 0 ? vec3(0.545, 0.955, 0.42) : vec3(0.31, 0.90, 0.16);    // source uv, full length (fraction of height)
      float run = clamp(uDrip * (k == 0 ? 1.0 : 1.4) - 0.25 * float(k), 0.0, 1.0);
      if (run <= 0.0) continue;
      vec2 S = hO + T.xy * hs;
      float len = T.z * hs.y * run;
      float dy = sc.y - S.y;
      float cx = S.x + 0.6 * uCell.x * sin(dy / (3.0 * uCell.y) + float(k) * 2.0);
      float w = mix(0.9, 0.6, clamp(dy / max(len, 1.0), 0.0, 1.0)) * uCell.x;
      float sd = (dy > -uCell.y && dy < len) ? abs(sc.x - cx) - w : 1e5;
      float tipX = S.x + 0.6 * uCell.x * sin(len / (3.0 * uCell.y) + float(k) * 2.0);
      sd = min(sd, length(vec2(sc.x - tipX, (sc.y - S.y - len) * 0.7)) - 0.9 * uCell.x);
      if (k == 0) {                                                     // the drop: swells at the tip, lets go, falls
        float ph = fract(uTime / 7.3);
        float fy = S.y + len + uCell.y * (ph < 0.55 ? 0.0 : 160.0 * (ph - 0.55) * (ph - 0.55));
        float r = uCell.x * mix(0.4, 1.0, smoothstep(0.0, 0.55, ph));
        sd = min(sd, length(vec2(sc.x - tipX, (sc.y - fy) * 0.7)) - r);
      }
      if (sd < 0.0) outc = blood(0.30 + 0.16 * step(-0.5 * uCell.x, sd)) * glyph(floor((0.55 + 0.3 * h1) * (uN - 1.0)), f) * A;
    }
  }

  // ---- the card is stuck in the heart: its edges stained, blood leaving its lower edge ----
  if (uCard.z > uCard.x) {
    vec2 cc = 0.5 * (uCard.xy + uCard.zw), ch = 0.5 * (uCard.zw - uCard.xy);
    vec2 qd = abs(sc - cc) - ch;
    float sdB = length(max(qd, 0.0)) + min(max(qd.x, qd.y), 0.0);
    float along = sc.x + sc.y;
    float lowB = smoothstep(cc.y, uCard.w, sc.y);                       // heavier towards the bottom
    float topL = smoothstep(uCard.x + 160.0, uCard.x, sc.x) * smoothstep(uCard.y + 120.0, uCard.y, sc.y);   // pooled under the red notch
    float band = uCell.y * (0.2 + 1.1 * smoothstep(0.35, 0.8, vnoise(vec2(along / 50.0, 1.7))) * (0.3 + lowB + topL)) * uCardRun;   // dried, patchy
    if (sdB > 0.0 && sdB < band) {
      float e = sdB / max(band, 1.0);
      outc = blood(0.44 - 0.2 * e) * glyph(floor((0.6 - 0.35 * e) * (uN - 1.0) + (h0 - 0.5) * 3.0), f);
    }
    // blood runs from the corners: down the outside of both sides from the top, and off both lower corners
    for (int i = 0; i < 2; i++) {
      float ex = i == 0 ? uCard.x - 0.5 * uCell.x : uCard.z + 0.5 * uCell.x;
      float lenS = (uCard.w - uCard.y) * (i == 0 ? 0.62 : 0.4) * clamp(uCardRun * 1.3, 0.0, 1.0);
      float dyS = sc.y - uCard.y;
      float wS = uCell.x * mix(0.9, 0.5, clamp(dyS / max(lenS, 1.0), 0.0, 1.0));
      float sdS = (dyS > -uCell.y && dyS < lenS) ? abs(sc.x - ex - 0.3 * uCell.x * sin(dyS / (4.0 * uCell.y) + float(i))) - wS : 1e5;
      sdS = min(sdS, length(vec2(sc.x - ex, (sc.y - uCard.y - lenS) * 0.7)) - 0.9 * uCell.x * step(1.0, lenS));
      sdS = min(sdS, length((sc - vec2(ex, uCard.y)) * vec2(0.6, 1.0)) - 1.6 * uCell.x * step(0.01, uCardRun));   // pooled in the corner
      if (sdS < 0.0) outc = blood(0.36 + 0.14 * step(-0.5 * uCell.x, sdS)) * glyph(floor((0.55 + 0.3 * h1) * (uN - 1.0)), f);
    }
    for (int i = 0; i < 3; i++) {
      float fi = float(i);
      float hl = hash(vec2(fi, 9.1));
      float x0 = i == 0 ? uCard.x : i == 1 ? mix(uCard.x, uCard.z, 0.63) : uCard.z;
      float len = (i == 0 ? 330.0 : i == 1 ? 110.0 : 250.0) * uCell.y / 14.0 * clamp(uCardRun * (1.0 + hl) - 0.1 * fi, 0.0, 1.0);
      float dy = sc.y - uCard.w;
      float w = uCell.x * (i == 1 ? 0.55 : 0.85) * mix(1.0, 0.65, clamp(dy / max(len, 1.0), 0.0, 1.0));
      float cx = x0 + 0.25 * uCell.x * sin(dy / 37.0 + fi);
      float sd = (dy > -2.0 && dy < len) ? abs(sc.x - cx) - w : 1e5;
      sd = min(sd, length(vec2(sc.x - cx, (sc.y - uCard.w - len) * 0.8)) - 1.0 * uCell.x * step(1.0, len));
      if (i != 1) sd = min(sd, length((sc - vec2(x0, uCard.w)) * vec2(0.6, 1.0)) - 1.8 * uCell.x * step(0.01, uCardRun));   // gathered at the corner first
      if (sd < 0.0) outc = blood(0.36 + 0.16 * step(-0.6 * uCell.x, sd)) * glyph(floor((0.55 + 0.3 * h1) * (uN - 1.0)), f);
    }
  }
  o = vec4(uDebug > 3.5 ? vec3(idx / (uN - 1.0)) : uDebug > 2.5 ? col : uDebug > 1.5 ? vec3(Ln) : uDebug > 0.5 ? raw : outc, 1.0);
}
</script>

<script>
// ============ profile: everything on the card comes from here ============
const PROFILE = {
  name: 'void',
  handle: 'void.main.dev',                 // shown under the name; click copies it
  bio: ['shine like a star but die for me.'],
  mark: 'die for me',
  avatar: null,                            // image path; null = the sigil
  discordId: '228868010578935808',                         // numeric Discord user id for live status (must join discord.gg/lanyard)
  music: null,                             // e.g. 'music.mp3'; null hides the sound button
  links: [                                 // icon = simple-icons slug
    { icon: 'discord', label: 'discord', copy: 'voidcore.wtf' },
    { icon: 'github', label: 'github', url: 'https://github.com/void-main-dev' },
    { icon: 'gitlab', label: 'gitlab', url: 'https://gitlab.com/void-main-dev' },
    { icon: 'x', label: 'x', url: 'https://x.com/voidmaindevacc' },
    { icon: 'instagram', label: 'instagram', url: 'https://instagram.com/voidmaindevacc' },
    { icon: 'tiktok', label: 'tiktok', url: 'https://tiktok.com/@voidmaindevacc' },
    { icon: 'twitch', label: 'twitch', url: 'https://twitch.tv/voidmaindevacc' },
    { icon: 'reddit', label: 'reddit', url: 'https://reddit.com/user/void-main-dev' },
  ],
  projects: [],                            // { title, desc, url }
};
// =========================================================================

const RAMP = " .`'-:;,\"^~!i|l/\\()rtjfxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
const STARS = "+|-•*";
const LOVE = "iloveyu";                 // the heart is written in these: i love you
const EYE = { w: 2280, h: 1400, cx: 1165, cy: 865, R: 142 };
const IRIS = { x0: EYE.cx - 1.3 * EYE.R, y0: EYE.cy - 1.3 * EYE.R, size: 2.6 * EYE.R, tex: 3072 };
const DIVE = 3.6;                       // the zoom waits for the tears
const END = 14.9;                       // zoom finished
const CARD_AT = 13.6;                   // card fades in over the heart

const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const FREEZE = Q.has('f') ? parseFloat(Q.get('f')) : null;   // ?f=6.5 holds that moment (for checks)
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(pointer: fine)').matches;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const RETURNING = store.get('void.seen') === '1';
const SPEED = RETURNING ? 2 : 1;        // second visit: same dive, twice as fast

if (!FINE) $('enterLabel').dataset.word = 'tap';

// ---------------- card ----------------
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1600);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); } catch (e2) {} a.remove();
  }
  toast('copied ' + text);
}

function buildCard() {
  $('name').textContent = PROFILE.name.toUpperCase();
  $('motto').textContent = 'VENI · VIDI · VICI';
  if (PROFILE.handle) {
    const b = document.createElement('button'); b.textContent = '@' + PROFILE.handle; b.title = 'copy';
    b.onclick = () => copy(PROFILE.handle); $('handle').appendChild(b);
  }
  for (const l of PROFILE.links) {
    const el = document.createElement(l.url ? 'a' : 'button');
    if (l.url) { el.href = l.url; el.target = '_blank'; el.rel = 'noopener me'; }
    else el.onclick = () => copy(l.copy);
    el.title = l.label; el.setAttribute('aria-label', l.label);
    const img = document.createElement('img'); img.alt = ''; img.loading = 'lazy';
    img.src = `https://cdn.jsdelivr.net/npm/simple-icons@13/icons/${l.icon}.svg`;
    el.appendChild(img); $('links').appendChild(el);
  }
  if (PROFILE.projects.length) {
    const box = $('projects'); box.classList.add('show');
    for (const p of PROFILE.projects) {
      const a = document.createElement('a'); a.href = p.url || '#'; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = '<div class="pt"></div><div class="pd"></div>';
      a.querySelector('.pt').textContent = '› ' + p.title; a.querySelector('.pd').textContent = p.desc || '';
      box.appendChild(a);
    }
  }
}

function scramble(el, text, dur = 900) {      // letters settle out of the glyph ramp, left to right
  const t0 = performance.now(), pool = 'AVXMNOIDCHRS';
  (function step(now) {
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = [...text].map((ch, i) => k > (i + 1) / (text.length + 1) ? ch : pool[Math.random() * pool.length | 0]).join('');
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
// paint the first n letters of a line; PROFILE.mark is set in blood
function paint(el, s, n) {
  const k = PROFILE.mark ? s.indexOf(PROFILE.mark) : -1;
  if (k < 0) { el.textContent = s.slice(0, n); return; }
  const e = k + PROFILE.mark.length;
  el.replaceChildren(s.slice(0, Math.min(n, k)));
  if (n > k) { const b = document.createElement('em'); b.textContent = s.slice(k, Math.min(n, e)); el.append(b); }
  if (n > e) el.append(s.slice(e, n));
}

function typewriter(el, lines) {
  if (REDUCED || FREEZE !== null) { paint(el, lines[0], lines[0].length); return; }
  let li = 0, ci = 0, del = false;
  (function tick() {
    const s = lines[li];
    if (!del) { paint(el, s, ++ci); if (ci === s.length) { del = lines.length > 1; return setTimeout(tick, 2600); } }
    else { paint(el, s, --ci); if (ci === 0) { del = false; li = (li + 1) % lines.length; } }
    setTimeout(tick, del ? 28 : 55 + Math.random() * 50);
  })();
}

let cardShown = false, cardT = null;
function showCard() {
  if (cardShown) return; cardShown = true; cardT = performance.now();
  $('card').classList.add('show');
  if (FREEZE === null) scramble($('name'), PROFILE.name.toUpperCase());
  setTimeout(() => typewriter($('bio'), PROFILE.bio), 500);
  $('skip').hidden = true;
  if (FREEZE === null) setTimeout(() => { $('replay').hidden = false; }, 1500);
  store.set('void.seen', '1');
}

// hover tilt, fine pointer only
if (FINE && !REDUCED) addEventListener('pointermove', e => {
  const c = $('card');
  c.style.setProperty('--ry', ((e.clientX / innerWidth) - .5) * 7 + 'deg');
  c.style.setProperty('--rx', -((e.clientY / innerHeight) - .5) * 7 + 'deg');
});

// ---------------- live Discord status (Lanyard) ----------------
async function presence() {
  if (!PROFILE.discordId) return;
  try {
    const r = await fetch(`https://api.lanyard.rest/v1/users/${PROFILE.discordId}`);
    const { data: d } = await r.json();
    const st = $('status'); st.style.display = 'inline-block'; st.className = 'status ' + (d.discord_status || 'offline');
    st.title = d.discord_status;
    const p = $('presence');
    if (d.listening_to_spotify && d.spotify) {
      $('presK').textContent = 'listening on spotify'; $('presV').textContent = d.spotify.song; $('presW').textContent = d.spotify.artist;
      $('presImg').src = d.spotify.album_art_url; $('presImg').style.display = ''; p.classList.add('show');
    } else {
      const a = (d.activities || []).find(x => x.type === 0);
      if (a) {
        $('presK').textContent = 'playing'; $('presV').textContent = a.name; $('presW').textContent = a.details || a.state || '';
        const li = a.assets && a.assets.large_image;
        if (li && !li.startsWith('mp:')) { $('presImg').src = `https://cdn.discordapp.com/app-assets/${a.application_id}/${li}.png`; $('presImg').style.display = ''; }
        else $('presImg').style.display = 'none';
        p.classList.add('show');
      } else p.classList.remove('show');
    }
  } catch (e) {}
  setTimeout(presence, 30000);
}

// ---------------- sound ----------------
const audio = $('music');
if (PROFILE.music) { audio.src = PROFILE.music; $('sound').hidden = false; }
function setSound(on) {
  if (!PROFILE.music) return;
  if (on) { audio.volume = 0; audio.play().then(() => fade(.55)).catch(() => {}); } else fade(0, () => audio.pause());
  $('sound').classList.toggle('on', on); $('soundLabel').textContent = on ? 'sound' : 'muted';
  store.set('void.muted', on ? '0' : '1');
}
function fade(to, done) {
  cancelAnimationFrame(fade.h); const from = audio.volume, t0 = performance.now();
  (function s(n) { const k = Math.min(1, (n - t0) / 1200); audio.volume = from + (to - from) * k; k < 1 ? fade.h = requestAnimationFrame(s) : done && done(); })(t0);
}
$('sound').onclick = () => setSound(audio.paused);

// ---------------- ASCII cursor trail ----------------
function trail() {
  if (!FINE || REDUCED) return;
  const cv = $('trail'), x = cv.getContext('2d'), parts = [];
  const fit = () => { const d = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; x.setTransform(d, 0, 0, d, 0, 0); };
  fit(); addEventListener('resize', fit);
  let lx = -1, ly = -1;
  addEventListener('pointermove', e => {
    if (Math.hypot(e.clientX - lx, e.clientY - ly) < 9) return; lx = e.clientX; ly = e.clientY;
    const d = Math.min(devicePixelRatio || 1, 2), cw = cell[0] / d, chh = cell[1] / d;   // snap to the same grid as the eye
    parts.push({ x: (Math.floor(e.clientX / cw) + .5) * cw, y: (Math.floor(e.clientY / chh) + .5) * chh, ch: RAMP[8 + (Math.random() * 30 | 0)],
                 t: performance.now(), cw, chh, red: Math.random() < .45 });
    if (parts.length > 60) parts.shift();
  });
  (function draw(now) {
    x.clearRect(0, 0, innerWidth, innerHeight);
    x.font = `700 ${Math.round((cell[1] / Math.min(devicePixelRatio || 1, 2)) * 0.82)}px "Geist Mono", monospace`; x.textAlign = 'center'; x.textBaseline = 'middle';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i], age = (now - p.t) / 1100;
      if (age >= 1) { parts.splice(i, 1); continue; }
      const dt = now - p.t;
      const fall = Math.floor(dt * dt * 0.0000045 * (p.red ? 1 : 0.4) / (p.chh / 19)) * p.chh;   // blood drops a row at a time, ash lingers
      x.fillStyle = p.red ? `rgba(155,26,34,${(1 - age) * .95})` : `rgba(200,198,204,${(1 - age) * .6})`;
      x.fillText(p.ch, p.x, p.y + fall);
    }
    requestAnimationFrame(draw);
  })(0);
}

// ---------------- the eye ----------------
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const seg = (t, a, b) => ease((t - a) / (b - a));
let gl = null, U = null, cv = $('c');

function initGL() {
  gl = cv.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
  if (!gl) throw new Error('no webgl2');
  const shader = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, `#version 300 es
in vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }`));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, $('fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  U = n => gl.getUniformLocation(prog, n);
}

function texture(unit, src, mip) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  if (mip) gl.generateMipmap(gl.TEXTURE_2D);
  return t;
}
const load = src => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });

let cell = [10, 19];
function atlas() {                       // one row of glyphs, white on transparent, at device pixels
  const all = RAMP + STARS + LOVE;
  const c = document.createElement('canvas');
  c.width = cell[0] * all.length; c.height = cell[1];
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `700 ${Math.round(cell[1] * 0.82)}px "Geist Mono", monospace`;
  [...all].forEach((ch, i) => x.fillText(ch, (i + 0.5) * cell[0], cell[1] * 0.54));
  // order the ramp by real ink coverage in this font and size, so density tracks brightness
  const px = x.getImageData(0, 0, c.width, c.height).data;
  const ink = [...RAMP].map((ch, i) => {
    let s = 0;
    for (let yy = 0; yy < cell[1]; yy++) for (let xx = i * cell[0]; xx < (i + 1) * cell[0]; xx++) s += px[(yy * c.width + xx) * 4 + 3];
    return [ch, s];
  });
  const sorted = ink.sort((a, b) => a[1] - b[1]).map(a => a[0]).join('') + STARS + LOVE;
  x.clearRect(0, 0, c.width, c.height);
  [...sorted].forEach((ch, i) => x.fillText(ch, (i + 0.5) * cell[0], cell[1] * 0.54));
  texture(2, c, false);
  gl.uniform1f(U('uN'), RAMP.length); gl.uniform1f(U('uNT'), all.length);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, cv.width, cv.height);
  const ch = Math.max(11, Math.round(cv.height / 100));
  cell = [Math.round(ch * 0.55), ch];
  atlas();
  gl.uniform2f(U('uRes'), cv.width, cv.height);
  gl.uniform2f(U('uCell'), cell[0], cell[1]);
}

// ---- timeline (seconds after click) ----
function frame(t) {
  const H = cv.height;
  const s0 = Math.min(1000 / H, 2200 / cv.width);      // eye + brow, photo covers the screen
  const pupilD = 2 * 0.30 * EYE.R;
  const HU = 10;                                       // heart unit, photo px: the heart is ~0.28 of the pupil, from dot to end
  const s1 = Math.min(2.4 * HU / (0.32 * Math.max(cv.width, 1.15 * H)), pupilD / (1.02 * Math.hypot(cv.width, H)));   // heart ends ~40% wide (on a phone, sized by height so it shows around the card), pupil covers the screen
  const z = (t - DIVE) / (END - DIVE);
  const zz = ease(z);                                  // gentle start and end; the iris ring slides out past the edges
  const scale = s0 * Math.pow(s1 / s0, zz);
  return {
    reveal: seg(t, 0.2, 1.7), scale, cx: EYE.cx, cy: EYE.cy,
    stars: seg(t, 7.4, 10.9), starsAll: 0.6 * seg(t, 12.4, 14.4),
    eye: 1,
    heart: seg(t, 4.4, 5.9),                            // red dot in the pupil; grows with the zoom
    heartUnit: HU,
    drip: seg(t, 8.5, 14.5),
    glow: seg(t, 6.4, 9.9) * (1 - seg(t, 11.4, 13.4)),   // blood glyphs fill the pupil around the heart
    look: 1 - seg(t, DIVE, DIVE + 2.0),
    tear: [ease(seg(t, 1.1, 3.9)), ease(seg(t, 1.6, 4.6)), ease(seg(t, 2.3, 4.3))],   // three black tears, not quite together                         // the eye follows the cursor until the dive starts
  };
}

// the iris drifts towards the pointer (or tilts with the phone), eased
const look = { x: 0, y: 0, tx: 0, ty: 0 };
addEventListener('pointermove', e => {
  look.tx = (e.clientX / innerWidth - .5) * 2; look.ty = (e.clientY / innerHeight - .5) * 2;
});

// a failing heart: long silences, weak beats, some missed; the same every visit
const BEATS = (() => {
  const h = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const out = []; let t = 0.8;
  for (let i = 0; t < 7200; i++) {
    if (h(i + 0.5) > 0.2) out.push([t, 0.35 + 0.65 * h(i + 0.9)]);
    t += 2.2 + 2.6 * h(i + 0.3);
  }
  return out;
})();
function beat(t) {                                     // lub-dub, both soft
  let lo = 0, hi = BEATS.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (BEATS[m][0] <= t) lo = m; else hi = m - 1; }
  const [t0, a] = BEATS[lo], d = t - t0;
  if (d < 0) return 0;
  return a * (Math.exp(-d * 6) + (d > 0.24 ? 0.45 * Math.exp(-(d - 0.24) * 7) : 0)) / 1.05;
}

let start = null, last = 0;
const tNow = now => FREEZE !== null ? FREEZE : REDUCED && start !== null ? END + 1 : start === null ? -1 : (now - start) / 1000 * SPEED;
function draw(now) {
  requestAnimationFrame(draw);
  const t = tNow(now);
  if (t > END + 1.5 && now - last < 30) return;        // after the dive only the stars move: ~30fps is enough
  last = now;
  const k = frame(t);
  look.x += (look.tx - look.x) * .06; look.y += (look.ty - look.y) * .06;
  const L = REDUCED ? 0 : 0.30 * EYE.R * k.look;
  const lx = look.x * L, ly = look.y * L * .6;
  gl.uniform2f(U('uCam'), k.cx, k.cy);
  gl.uniform1f(U('uScale'), k.scale);
  gl.uniform1f(U('uReveal'), k.reveal);
  gl.uniform1f(U('uStars'), k.stars);
  gl.uniform1f(U('uStarsAll'), k.starsAll);
  gl.uniform1f(U('uEyeAmt'), k.eye);
  // once the card is up the heart steps back into a soft glow behind the glass
  const back = cardT === null ? 0 : FREEZE !== null || REDUCED ? 1 : ease((now - cardT) / 1400);
  gl.uniform1f(U('uHeart'), k.heart * (1 - 0.3 * back));
  if (cardT !== null) {
    const r = $('card').getBoundingClientRect(), d = cv.width / innerWidth;
    gl.uniform4f(U('uCard'), r.left * d, r.top * d, r.right * d, r.bottom * d);
    gl.uniform1f(U('uCardRun'), FREEZE !== null || REDUCED ? 1 : ease((now - cardT) / 9000));
  } else gl.uniform4f(U('uCard'), 0, 0, 0, 0);
  gl.uniform1f(U('uHeartUnit'), k.heartUnit);
  gl.uniform1f(U('uGlow'), k.glow);
  gl.uniform1f(U('uDrip'), k.drip);
  gl.uniform3f(U('uTear'), k.tear[0], k.tear[1], k.tear[2]);
  gl.uniform2f(U('uLook'), lx, ly);
  gl.uniform2f(U('uHeartC'), EYE.cx + lx, EYE.cy + ly);
  gl.uniform1f(U('uTime'), now / 1000);
  gl.uniform1f(U('uBeat'), beat(now / 1000));
  gl.uniform1f(U('uHW'), +(Q.get('hw') || 2.5));
  gl.uniform1f(U('uHM'), +(Q.get('hm') || 0));
  gl.uniform1f(U('uLove'), Q.has('love') ? +Q.get('love') : 1);
  gl.uniform1f(U('uGamma'), +(Q.get('g') || 0.8));
  gl.uniform1f(U('uDebug'), 0);
  gl.uniform1f(U('uLo'), +(Q.get('lo') || 0.1));
  gl.uniform1f(U('uIB'), 0.10);
  gl.uniform1f(U('uCB'), 0.75);
  gl.uniform1f(U('uK'), +(Q.get('k') || 1.1));
  gl.uniform1f(U('uLC'), +(Q.get('lc') || 0.6));
  gl.uniform1f(U('uDi'), 3.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (t >= CARD_AT) showCard();
  else if (start !== null && FREEZE === null && $('skip').hidden && !cardShown) $('skip').hidden = false;
}

// ---------------- entry ----------------
let ready = false, wanted = false, glOk = true;
function go() {
  if (start !== null) return;
  if (PROFILE.music && store.get('void.muted') !== '1') setSound(true);   // inside the click: browsers allow sound now
  if (!ready) { wanted = true; $('enterLabel').textContent = 'entering'; return; }
  $('enter').classList.add('gone');
  if (!glOk) { showCard(); return; }
  start = performance.now();
  if (REDUCED) showCard();
}
$('enter').addEventListener('click', go);
addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && start === null && !$('enter').classList.contains('gone')) { e.preventDefault(); go(); } });
$('skip').onclick = () => { start = performance.now() - (END + .2) * 1000 / SPEED; };
$('replay').onclick = () => {
  cardShown = false; cardT = null; $('card').classList.remove('show'); $('replay').hidden = true;
  start = performance.now();
};

function setReady() {
  ready = true;
  $('enter').classList.remove('loading');
  $('enterLabel').innerHTML = `<b>${$('enterLabel').dataset.word || 'click'}</b> to enter`;
  $('enterSub').textContent = RETURNING ? 'welcome back' : '';
  if (wanted) go();
}

buildCard();
presence();
trail();
(async () => {
  await document.fonts.load('700 16px "Geist Mono"').catch(() => {});
  let iris = null;
  try {
    const [eye, ir, hrt] = await Promise.all([load('eye_v.webp?v=2'), load('iris.webp?v=7'), load('heart.webp?v=1')]);
    iris = ir;
    initGL();
    texture(0, eye, true); texture(1, iris, true); texture(3, hrt, true);
    gl.uniform1i(U('uEye'), 0); gl.uniform1i(U('uIris'), 1); gl.uniform1i(U('uAtlas'), 2); gl.uniform1i(U('uHeartT'), 3);
    gl.uniform2f(U('uEyeSize'), EYE.w, EYE.h);
    gl.uniform4f(U('uIrisBox'), IRIS.x0, IRIS.y0, IRIS.size, IRIS.tex);
    resize(); addEventListener('resize', resize);
    requestAnimationFrame(draw);
  } catch (e) {
    glOk = false; document.body.classList.add('nogl');
  }
  if (PROFILE.avatar) $('emblem').src = PROFILE.avatar;
  if (FREEZE !== null) { $('card').classList.add('instant'); $('enter').style.transition = 'none'; $('enter').classList.add('gone'); start = 0; if (!glOk || FREEZE >= CARD_AT) showCard(); }
  setReady();
})();
</script>
</body>
